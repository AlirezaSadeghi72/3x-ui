---
version: "3"

services:
  3x1-ui:
    image: ghcr.io/AlirezaSadeghi72/3x1-ui:latest
    container_name: 3x1-ui
    hostname: yourhostname
    volumes:
      - $PWD/db/:/etc/x1-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    tty: true
    network_mode: host
    restart: unless-stopped
